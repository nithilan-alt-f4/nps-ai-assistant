name: Sync NPS Briefing Data

on:
  schedule:
    # Morning scrape: 7:00 AM IST (01:30 UTC)
    - cron: '30 1 * * *'
    # Afternoon scrape: 1:00 PM IST (07:30 UTC)
    - cron: '30 7 * * *'
    # Midnight scrape: 00:00 IST (18:30 UTC previous day)
    # (Aakash WhatsApp -> School calendar sync runs on your phone via Termux, not in this job)
    - cron: '30 18 * * *'
  workflow_dispatch: # manual trigger

jobs:
  scrape-and-export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Scrape NPS portal
        run: node scripts/scrape-nps.mjs
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          NPS_PORTAL_URL: ${{ secrets.NPS_PORTAL_URL }}
          NPS_USERNAME: ${{ secrets.NPS_USERNAME }}
          NPS_PASSWORD: ${{ secrets.NPS_PASSWORD }}

      - name: Sync Gmail
        run: node scripts/sync-gmail.mjs
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}

      - name: Sync News
        run: node scripts/sync-news.mjs
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}

      - name: Generate briefing narrative
        run: node scripts/generate-briefing.mjs
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Export data to JSON
        run: node scripts/export-data.mjs
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          GCAL_CLIENT_ID: ${{ secrets.GCAL_CLIENT_ID }}
          GCAL_CLIENT_SECRET: ${{ secrets.GCAL_CLIENT_SECRET }}
          GCAL_REFRESH_TOKEN: ${{ secrets.GCAL_REFRESH_TOKEN }}
          SCHOOL_CALENDAR_ID: ${{ secrets.SCHOOL_CALENDAR_ID }}

      - name: Commit updated data
        run: |
          git config user.name "NPS Bot"
          git config user.email "bot@nps-briefing"
          git add public/data/
          git diff --staged --quiet || git commit -m "data: auto-sync $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
